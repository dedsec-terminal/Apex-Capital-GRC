<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="t d"><title id="t">Risk control test evidence traceability</title><desc id="d">A scenario risk informs control intent, procedure, observed artifact and reviewed disposition.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#456b83"/></marker></defs><rect width="900" height="290" rx="12" fill="#f8fafb"/><text x="35" y="36" font-family="Arial" font-size="17" font-weight="700" fill="#1c3343">TRACEABILITY KEEPS RISK DECISIONS AUDITABLE</text><g font-family="Arial"><rect x="30" y="91" width="150" height="92" rx="8" fill="#fff" stroke="#c6d4dc"/><text x="105" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#617787">SCENARIO</text><text x="105" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#29495f">Risk R-001</text><text x="105" y="162" text-anchor="middle" font-size="11" fill="#657783">DMZ lateral reach</text><rect x="210" y="91" width="150" height="92" rx="8" fill="#fff" stroke="#c6d4dc"/><text x="285" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#617787">INTENT</text><text x="285" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#29495f">Control objective</text><text x="285" y="162" text-anchor="middle" font-size="11" fill="#657783">Default-deny path</text><rect x="390" y="91" width="150" height="92" rx="8" fill="#fff" stroke="#c6d4dc"/><text x="465" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#617787">PROCEDURE</text><text x="465" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#29495f">Test T-01</text><text x="465" y="162" text-anchor="middle" font-size="11" fill="#657783">Paired path checks</text><rect x="570" y="91" width="150" height="92" rx="8" fill="#fff" stroke="#c6d4dc"/><text x="645" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#617787">OBSERVATION</text><text x="645" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#29495f">Evidence artifact</text><text x="645" y="162" text-anchor="middle" font-size="11" fill="#657783">Rules + output + logs</text><rect x="750" y="91" width="120" height="92" rx="8" fill="#15374d"/><text x="810" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#d9e5ed">REVIEW</text><text x="810" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Disposition</text><text x="810" y="162" text-anchor="middle" font-size="11" fill="#d9e5ed">Owner · date</text></g><path d="M180 137H204M360 137H384M540 137H564M720 137H744" stroke="#456b83" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="234" font-family="Arial" font-size="11" fill="#657783">A planned test or expected result is not evidence of control operation. Residual risk follows reviewed evidence.</text></svg>
