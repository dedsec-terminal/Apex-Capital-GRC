<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">Proposed telemetry and triage evidence path</title><desc id="d">Windows, Linux and pfSense send events to Wazuh; analyst reviews alert and captures sanitized evidence. Not deployed.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#456b83"/></marker></defs><rect width="900" height="330" rx="12" fill="#f8fafb"/><text x="35" y="36" font-family="Arial" font-size="17" font-weight="700" fill="#1c3343">EVENT TO REVIEWABLE EVIDENCE · INTENDED PIPELINE</text><g font-family="Arial"><rect x="35" y="85" width="180" height="63" rx="8" fill="#fff" stroke="#c6d4dc"/><text x="125" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#29495f">Event sources</text><text x="125" y="132" text-anchor="middle" font-size="11" fill="#657783">Windows · Ubuntu · pfSense</text><rect x="275" y="85" width="170" height="63" rx="8" fill="#eaf1f5" stroke="#b7c6d0"/><text x="360" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#29495f">Secure collection</text><text x="360" y="132" text-anchor="middle" font-size="11" fill="#657783">Wazuh agent / syslog intent</text><rect x="505" y="85" width="160" height="63" rx="8" fill="#15374d"/><text x="585" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Correlate &amp; alert</text><text x="585" y="132" text-anchor="middle" font-size="11" fill="#d9e5ed">Rule · timestamp · source</text><rect x="725" y="85" width="145" height="63" rx="8" fill="#fff" stroke="#c6d4dc"/><text x="797" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#29495f">Analyst triage</text><text x="797" y="132" text-anchor="middle" font-size="11" fill="#657783">Validate &amp; disposition</text></g><path d="M215 116H270M445 116H500M665 116H720" stroke="#456b83" stroke-width="3" marker-end="url(#a)"/><rect x="275" y="213" width="390" height="62" rx="8" fill="#fff" stroke="#c6d4dc"/><text x="470" y="239" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#29495f">Sanitized evidence record</text><text x="470" y="260" text-anchor="middle" font-family="Arial" font-size="11" fill="#657783">Event · alert ID · timestamps · source · reviewer · disposition</text><path d="M797 149V185H665" fill="none" stroke="#456b83" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="308" font-family="Arial" font-size="11" fill="#657783">Collection, time sync, alert coverage, retention and retrieval have not been validated.</text></svg>
