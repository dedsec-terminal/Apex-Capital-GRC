<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Proposed third-party risk workflow</title><desc id="d">Supplier intake, criticality, evidence review, gap scoring and decision, remediation and monitoring. No actual vendor review has been performed.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#456b83"/></marker></defs><rect width="900" height="300" rx="12" fill="#f8fafb"/><text x="35" y="36" font-family="Arial" font-size="17" font-weight="700" fill="#1c3343">THIRD-PARTY ASSURANCE · PROPOSED CONTROL WORKFLOW</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#c6d4dc"><rect x="25" y="91" width="130" height="82" rx="8"/><rect x="180" y="91" width="130" height="82" rx="8"/><rect x="335" y="91" width="130" height="82" rx="8"/><rect x="490" y="91" width="130" height="82" rx="8"/><rect x="645" y="91" width="130" height="82" rx="8"/><rect x="800" y="91" width="80" height="82" rx="8"/></g><g fill="#29495f" font-size="12" font-weight="700"><text x="90" y="119">Intake</text><text x="245" y="119">Criticality</text><text x="400" y="119">Evidence</text><text x="555" y="119">Gaps &amp; risk</text><text x="710" y="119">Decision</text><text x="840" y="119">Monitor</text></g><g fill="#657783" font-size="10"><text x="90" y="143">Service · data</text><text x="245" y="143">Impact · access</text><text x="400" y="143">Request · verify</text><text x="555" y="143">Score · rationale</text><text x="710" y="143">Owner · approve</text><text x="840" y="143">Review</text></g></g><path d="M155 132H174M310 132H329M465 132H484M620 132H639M775 132H794" stroke="#456b83" stroke-width="2.5" marker-end="url(#a)"/><rect x="178" y="212" width="545" height="44" rx="7" fill="#eaf1f5"/><text x="450" y="239" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#29495f">Treatment plan · remediation owner · due date · reassessment trigger · exit/offboarding</text><path d="M710 175V196H723" fill="none" stroke="#456b83" stroke-width="2" marker-end="url(#a)"/><text x="35" y="280" font-family="Arial" font-size="11" fill="#657783">R-007 remains a scenario risk. This workflow is a proposed learning model; no real supplier evidence is assessed.</text></svg>
