<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">Proposed network flow policy</title><desc id="d">Administrative, web and telemetry flows are intended allowed paths; DMZ to internal is denied by default. None tested.</desc><defs><marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#33745d"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#aa4a45"/></marker></defs><rect width="900" height="390" rx="12" fill="#f8fafb"/><text x="38" y="35" font-family="Arial" font-size="17" font-weight="700" fill="#1c3343">FLOW INTENT · ENFORCE AND VERIFY AT THE FIREWALL</text><rect x="38" y="84" width="210" height="58" rx="7" fill="#fff" stroke="#c6d4dc"/><text x="55" y="108" font-family="Arial" font-size="13" font-weight="700" fill="#29495f">Approved management source</text><text x="55" y="128" font-family="Arial" font-size="11" fill="#657783">Named admin endpoint(s), not entire /24</text><rect x="650" y="72" width="210" height="58" rx="7" fill="#fff" stroke="#c6d4dc"/><text x="667" y="96" font-family="Arial" font-size="13" font-weight="700" fill="#29495f">DMZ web host</text><text x="667" y="116" font-family="Arial" font-size="11" fill="#657783">TCP 80/443 · explicit port-forward</text><rect x="650" y="164" width="210" height="58" rx="7" fill="#fff" stroke="#c6d4dc"/><text x="667" y="188" font-family="Arial" font-size="13" font-weight="700" fill="#29495f">Internal Windows host</text><text x="667" y="208" font-family="Arial" font-size="11" fill="#657783">TCP 3389 · approved mgmt source</text><rect x="650" y="256" width="210" height="58" rx="7" fill="#fff" stroke="#c6d4dc"/><text x="667" y="280" font-family="Arial" font-size="13" font-weight="700" fill="#29495f">Wazuh management host</text><text x="667" y="300" font-family="Arial" font-size="11" fill="#657783">1514/1515, 514 opt-in, dashboard 443</text><path d="M248 102C410 70 515 76 648 94" fill="none" stroke="#33745d" stroke-width="3" marker-end="url(#g)"/><text x="420" y="68" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#33745d">SSH 22 · restricted</text><path d="M248 116C415 151 500 177 648 190" fill="none" stroke="#33745d" stroke-width="3" marker-end="url(#g)"/><text x="440" y="160" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#33745d">RDP 3389 · restricted</text><path d="M412 160C475 198 526 255 648 280" fill="none" stroke="#33745d" stroke-width="2.5" marker-end="url(#g)"/><text x="493" y="237" font-family="Arial" font-size="10" font-weight="700" fill="#33745d">Host + firewall telemetry</text><rect x="38" y="257" width="210" height="57" rx="7" fill="#fff" stroke="#d7a5a1"/><text x="55" y="281" font-family="Arial" font-size="13" font-weight="700" fill="#963e39">DMZ → Internal subnet</text><text x="55" y="301" font-family="Arial" font-size="11" fill="#7a6562">Any service · deny by default</text><path d="M248 285H393" stroke="#aa4a45" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#r)"/><circle cx="410" cy="285" r="16" fill="#f7e8e6" stroke="#bd716b"/><path d="M402 277L418 293M418 277L402 293" stroke="#aa4a45" stroke-width="3"/><text x="38" y="357" font-family="Arial" font-size="11" fill="#657783">Proposed paths. Validate stateful returns, source restrictions, logging and positive/negative cases.</text></svg>
