<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">Proposed four VM network topology</title><desc id="d">WAN links to four-interface pfSense firewall separating DMZ, internal and management zones. Proposed, not deployed.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#456b83"/></marker></defs><rect width="900" height="390" rx="12" fill="#f8fafb"/><text x="40" y="35" font-family="Arial" font-size="17" font-weight="700" fill="#1c3343">PROPOSED FOUR-INTERFACE SECURITY LAB</text><text x="40" y="57" font-family="Arial" font-size="12" fill="#6b7d89">Logical architecture · values are design assumptions, not captured configuration</text><rect x="34" y="152" width="130" height="76" rx="7" fill="#e8eef2" stroke="#b7c6d0"/><text x="99" y="183" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#233d50">WAN / UPLINK</text><text x="99" y="203" text-anchor="middle" font-family="Arial" font-size="11" fill="#586d7a">Attachment TBD</text><line x1="164" y1="190" x2="245" y2="190" stroke="#456b83" stroke-width="3" marker-end="url(#a)"/><rect x="248" y="132" width="185" height="116" rx="9" fill="#15374d"/><text x="340" y="171" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">pfSense</text><text x="340" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="#d9e5ed">4 virtual interfaces</text><text x="340" y="218" text-anchor="middle" font-family="Arial" font-size="11" fill="#bdd0dc">WAN · DMZ · Internal · Mgmt</text><path d="M433 156H485V104H520M433 190H520M433 224H485V278H520" fill="none" stroke="#456b83" stroke-width="2.5"/><rect x="520" y="75" width="330" height="74" rx="7" fill="#fff" stroke="#c6d4dc"/><text x="538" y="98" font-family="Arial" font-size="12" font-weight="700" fill="#29495f">DMZ · 10.0.1.0/24 · gateway 10.0.1.1</text><text x="538" y="125" font-family="Arial" font-size="12" fill="#425d6e">Ubuntu web VM · 10.0.1.10 · simulated public service</text><rect x="520" y="157" width="330" height="74" rx="7" fill="#fff" stroke="#c6d4dc"/><text x="538" y="180" font-family="Arial" font-size="12" font-weight="700" fill="#29495f">INTERNAL · 10.0.2.0/24 · gateway 10.0.2.1</text><text x="538" y="207" font-family="Arial" font-size="12" fill="#425d6e">Windows VM · 10.0.2.10 · business host</text><rect x="520" y="239" width="330" height="74" rx="7" fill="#fff" stroke="#c6d4dc"/><text x="538" y="262" font-family="Arial" font-size="12" font-weight="700" fill="#29495f">MANAGEMENT · 10.0.3.0/24 · gateway 10.0.3.1</text><text x="538" y="289" font-family="Arial" font-size="12" fill="#425d6e">Wazuh VM · 10.0.3.10 · monitoring plane</text><text x="40" y="357" font-family="Arial" font-size="11" fill="#657783">Default-deny zone policy · WAN exposure, NAT and upstream network require design before deployment.</text></svg>
