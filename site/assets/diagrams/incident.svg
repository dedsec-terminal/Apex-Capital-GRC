<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Proposed incident response lifecycle</title><desc id="d">Prepare, detect, analyze, contain, eradicate, recover and learn. Not exercised in lab.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#456b83"/></marker></defs><rect width="900" height="300" rx="12" fill="#f8fafb"/><text x="35" y="36" font-family="Arial" font-size="17" font-weight="700" fill="#1c3343">INCIDENT RESPONSE · PROPOSED OPERATING LIFECYCLE</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#c6d4dc"><rect x="25" y="102" width="122" height="70" rx="8"/><rect x="170" y="102" width="122" height="70" rx="8"/><rect x="315" y="102" width="122" height="70" rx="8"/><rect x="460" y="102" width="122" height="70" rx="8"/><rect x="605" y="102" width="122" height="70" rx="8"/><rect x="750" y="102" width="122" height="70" rx="8"/></g><g fill="#29495f" font-size="13" font-weight="700"><text x="86" y="132">Prepare</text><text x="231" y="132">Detect</text><text x="376" y="132">Analyze</text><text x="521" y="132">Contain</text><text x="666" y="132">Eradicate</text><text x="811" y="132">Recover</text></g><g fill="#657783" font-size="10"><text x="86" y="153">Roles · playbooks</text><text x="231" y="153">Sources · alert</text><text x="376" y="153">Scope · impact</text><text x="521" y="153">Limit spread</text><text x="666" y="153">Remove cause</text><text x="811" y="153">Restore · verify</text></g></g><path d="M147 137H164M292 137H309M437 137H454M582 137H599M727 137H744" stroke="#456b83" stroke-width="2.5" marker-end="url(#a)"/><path d="M810 173V225H90V180" fill="none" stroke="#8b9ba6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="344" y="207" width="210" height="38" rx="6" fill="#eaf1f5"/><text x="449" y="231" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#29495f">Lessons learned · improve controls</text><text x="35" y="280" font-family="Arial" font-size="11" fill="#657783">Record decisions and evidence throughout; this response lifecycle has not been exercised in validation.</text></svg>
